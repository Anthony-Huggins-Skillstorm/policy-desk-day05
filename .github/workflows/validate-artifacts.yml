name: Validate artifacts

on:
  pull_request:
    paths:
      - ".github/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "corpus/**"
      - "index/**"
      - "eval/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" pyyaml==6.0.3

      - name: Validate Copilot customization artifacts
        run: python scripts/validate_artifacts.py

      - name: Unit tests (offline)
        run: pytest

      - name: Golden-eval regression check (offline, against the committed baseline)
        run: python .github/skills/golden-eval/scripts/compare_eval.py
